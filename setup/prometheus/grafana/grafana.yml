# =============================================================================
# Setup — Grafana (pairs with ../prometheus.yml)
# =============================================================================
# Prerequisites:
#   - Prometheus stack applied (setup/prometheus/prometheus.yml)
#   - ingress-nginx + *.test.local DNS
#
# Apply (from repo root — ConfigMap first so the Deployment can mount it):
#   kubectl create configmap grafana-dashboards -n monitoring \
#     --from-file=setup/prometheus/grafana/dashboards/ \
#     --from-file=setup/prometheus/mongodb/dashboards/ \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f setup/prometheus/grafana/grafana.yml
#
# UI: http://grafana.test.local  (admin / admin)
#
# Dashboard JSON files live in ./dashboards/ and ../mongodb/dashboards/ —
# add more *.json there, re-run the create configmap command, then:
#   kubectl -n monitoring rollout restart deployment/grafana
#
# What this file deploys:
#   1) ConfigMap — Prometheus datasource (auto-provisioned)
#   2) ConfigMap — dashboard provider (loads /etc/grafana/dashboards)
#   3) Deployment — Grafana
#   4) Service + Ingress
# =============================================================================

# -----------------------------------------------------------------------------
# BLOCK 1 — ConfigMap: Grafana datasource provisioning
# Grafana loads YAML under /etc/grafana/provisioning/datasources on startup.
# Points at the in-cluster Prometheus Service from prometheus.yml.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
        editable: true
---
# -----------------------------------------------------------------------------
# BLOCK 2 — ConfigMap: dashboard provider
# Tells Grafana to load JSON boards from /etc/grafana/dashboards.
# The boards themselves come from ConfigMap grafana-dashboards
# (created from ./dashboards/ — see header comments).
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/dashboards
---
# -----------------------------------------------------------------------------
# BLOCK 3 — Deployment: Grafana
# Mounts provisioning ConfigMaps; uses emptyDir for ephemeral lab storage.
# Login: admin / admin (lab only — change for anything shared).
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: storage
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: storage
          emptyDir: {}
---
# -----------------------------------------------------------------------------
# BLOCK 4 — Service for Grafana
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# -----------------------------------------------------------------------------
# BLOCK 5 — Ingress for Grafana UI
# Exposes http://grafana.test.local (same *.test.local pattern as Prometheus).
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
