# Shared local CA for k8slabs (apply once after cert-manager is installed).
# Usage: kubectl apply -f setup/local-ca.yml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: labs-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: k8slabs-ca
  secretName: labs-ca-secret
  duration: 87600h # 10 years
  renewBefore: 720h # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: labs-ca-issuer
spec:
  ca:
    secretName: labs-ca-secret
