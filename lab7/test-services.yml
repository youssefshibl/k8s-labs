# =============================================================================
# Lab 7 — Auto-instrumented demo apps (Python + Node.js) + PostgreSQL + Redis
# =============================================================================
# Annotations opt each Deployment into OpenTelemetry Operator injection.
# Instrumentation CR lives in monitoring (see instrumentation.yml).
#
# Flow for distributed traces (HTTP + DB + Redis spans):
#   Browser → hello-nodejs (redis + pg) → hello-python (redis + psycopg2)
#          → postgres / redis → OTLP collector → Jaeger
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: otel-demo
---
# -----------------------------------------------------------------------------
# PostgreSQL (demo database)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: otel-demo
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: appdb
  DATABASE_URL: postgresql://app:changeme@postgres.otel-demo.svc:5432/appdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: otel-demo
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "appdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: otel-demo
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# -----------------------------------------------------------------------------
# Redis (demo cache)
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: otel-demo
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: otel-demo
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# -----------------------------------------------------------------------------
# Python (Flask) — Postgres + Redis (auto-instrumented)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-python
  namespace: otel-demo
data:
  app.py: |
    import os
    import time

    import psycopg2
    import redis
    from flask import Flask, jsonify

    app = Flask(__name__)
    DATABASE_URL = os.environ["DATABASE_URL"]
    REDIS_URL = os.environ.get("REDIS_URL", "redis://redis.otel-demo.svc:6379/0")
    r = redis.from_url(REDIS_URL, decode_responses=True)


    def connect():
        return psycopg2.connect(DATABASE_URL)


    def wait_redis():
        for _ in range(30):
            try:
                r.ping()
                return
            except Exception as exc:
                print(f"waiting for redis: {exc}")
                time.sleep(2)
        raise RuntimeError("redis not ready")


    def init_db():
        for attempt in range(30):
            try:
                with connect() as conn:
                    with conn.cursor() as cur:
                        cur.execute(
                            """
                            CREATE TABLE IF NOT EXISTS notes (
                                id SERIAL PRIMARY KEY,
                                service TEXT NOT NULL,
                                message TEXT NOT NULL,
                                created_at TIMESTAMPTZ DEFAULT NOW()
                            )
                            """
                        )
                    conn.commit()
                return
            except Exception as exc:
                print(f"waiting for postgres: {exc}")
                time.sleep(2)
        raise RuntimeError("postgres not ready")


    @app.get("/")
    def root():
        return jsonify(service="hello-python", message="hello from python")


    @app.get("/api/hello")
    def hello():
        visits = r.incr("python:hello:visits")
        r.set("python:hello:last", str(int(time.time())), ex=3600)
        with connect() as conn:
            with conn.cursor() as cur:
                cur.execute(
                    "INSERT INTO notes (service, message) VALUES (%s, %s) RETURNING id",
                    ("hello-python", "hello"),
                )
                note_id = cur.fetchone()[0]
                cur.execute("SELECT count(*) FROM notes")
                count = cur.fetchone()[0]
            conn.commit()
        r.set("python:notes:count", str(count), ex=60)
        return jsonify(
            service="hello-python",
            path="/api/hello",
            note_id=note_id,
            notes_count=count,
            redis_visits=visits,
        )


    @app.get("/api/notes")
    def list_notes():
        cached = r.get("python:notes:list")
        if cached:
            return jsonify(service="hello-python", notes=cached, cache="hit")
        with connect() as conn:
            with conn.cursor() as cur:
                cur.execute(
                    "SELECT id, service, message, created_at::text "
                    "FROM notes ORDER BY id DESC LIMIT 20"
                )
                rows = [
                    {
                        "id": r_[0],
                        "service": r_[1],
                        "message": r_[2],
                        "created_at": r_[3],
                    }
                    for r_ in cur.fetchall()
                ]
        # store a short summary string so redis GET/SET show in traces
        r.set("python:notes:list", f"{len(rows)} notes", ex=10)
        return jsonify(service="hello-python", notes=rows, cache="miss")


    @app.get("/api/slow")
    def slow():
        time.sleep(0.3)
        r.setex("python:slow:flag", 30, "1")
        with connect() as conn:
            with conn.cursor() as cur:
                cur.execute("SELECT pg_sleep(0.2)")
                cur.execute(
                    "INSERT INTO notes (service, message) VALUES (%s, %s) RETURNING id",
                    ("hello-python", "slow"),
                )
                note_id = cur.fetchone()[0]
            conn.commit()
        return jsonify(service="hello-python", message="slow ok", note_id=note_id)


    if __name__ == "__main__":
        wait_redis()
        init_db()
        app.run(host="0.0.0.0", port=8080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-python
  namespace: otel-demo
  labels:
    app: hello-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-python
  template:
    metadata:
      labels:
        app: hello-python
      annotations:
        instrumentation.opentelemetry.io/inject-python: "monitoring/demo"
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          workingDir: /app
          command:
            - sh
            - -c
            - |
              pip install --no-cache-dir flask==3.0.3 psycopg2-binary==2.9.9 redis==5.1.1 >/tmp/pip.log 2>&1
              exec python /app/app.py
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: hello-python
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://redis.otel-demo.svc:6379/0
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: app
          configMap:
            name: hello-python
---
apiVersion: v1
kind: Service
metadata:
  name: hello-python
  namespace: otel-demo
  labels:
    app: hello-python
spec:
  selector:
    app: hello-python
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# -----------------------------------------------------------------------------
# Node.js (Express) — Redis + pg + call Python (distributed trace)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-nodejs
  namespace: otel-demo
data:
  package.json: |
    {
      "name": "hello-nodejs",
      "version": "1.0.0",
      "main": "server.js",
      "dependencies": {
        "express": "4.21.0",
        "pg": "8.13.0",
        "redis": "4.7.0"
      }
    }
  server.js: |
    const express = require("express");
    const http = require("http");
    const { Pool } = require("pg");
    const { createClient } = require("redis");

    const app = express();
    const port = 8080;
    const pythonHost = process.env.PYTHON_HOST || "hello-python.otel-demo.svc";
    const pythonPort = process.env.PYTHON_PORT || "8080";
    const pool = new Pool({ connectionString: process.env.DATABASE_URL });
    const redis = createClient({ url: process.env.REDIS_URL || "redis://redis.otel-demo.svc:6379/0" });

    async function initDb() {
      for (let i = 0; i < 30; i++) {
        try {
          await pool.query(`
            CREATE TABLE IF NOT EXISTS notes (
              id SERIAL PRIMARY KEY,
              service TEXT NOT NULL,
              message TEXT NOT NULL,
              created_at TIMESTAMPTZ DEFAULT NOW()
            )
          `);
          return;
        } catch (err) {
          console.log("waiting for postgres:", err.message);
          await new Promise((r) => setTimeout(r, 2000));
        }
      }
      throw new Error("postgres not ready");
    }

    async function initRedis() {
      for (let i = 0; i < 30; i++) {
        try {
          if (!redis.isOpen) await redis.connect();
          await redis.ping();
          return;
        } catch (err) {
          console.log("waiting for redis:", err.message);
          await new Promise((r) => setTimeout(r, 2000));
        }
      }
      throw new Error("redis not ready");
    }

    function callPython(path) {
      return new Promise((resolve, reject) => {
        const req = http.request(
          { hostname: pythonHost, port: pythonPort, path, method: "GET", timeout: 8000 },
          (res) => {
            let body = "";
            res.on("data", (c) => (body += c));
            res.on("end", () => resolve({ status: res.statusCode, body }));
          }
        );
        req.on("error", reject);
        req.end();
      });
    }

    app.get("/", async (_req, res) => {
      try {
        const visits = await redis.incr("nodejs:visits");
        await redis.set("nodejs:last_visit", new Date().toISOString(), { EX: 3600 });
        const insert = await pool.query(
          "INSERT INTO notes (service, message) VALUES ($1, $2) RETURNING id",
          ["hello-nodejs", "visit"]
        );
        const upstream = await callPython("/api/hello");
        const count = await pool.query("SELECT count(*)::int AS n FROM notes");
        await redis.set("nodejs:notes:count", String(count.rows[0].n), { EX: 60 });
        res.json({
          service: "hello-nodejs",
          message: "hello from node — redis + db + called python",
          note_id: insert.rows[0].id,
          notes_count: count.rows[0].n,
          redis_visits: visits,
          upstream,
        });
      } catch (err) {
        res.status(502).json({ service: "hello-nodejs", error: String(err) });
      }
    });

    app.get("/api/notes", async (_req, res) => {
      try {
        const cached = await redis.get("nodejs:notes:list");
        if (cached) {
          return res.json({ service: "hello-nodejs", notes: cached, cache: "hit" });
        }
        const result = await pool.query(
          "SELECT id, service, message, created_at::text AS created_at FROM notes ORDER BY id DESC LIMIT 20"
        );
        await redis.set("nodejs:notes:list", `${result.rows.length} notes`, { EX: 10 });
        res.json({ service: "hello-nodejs", notes: result.rows, cache: "miss" });
      } catch (err) {
        res.status(500).json({ service: "hello-nodejs", error: String(err) });
      }
    });

    app.get("/healthz", (_req, res) => res.send("ok"));

    Promise.all([initRedis(), initDb()])
      .then(() => {
        app.listen(port, "0.0.0.0", () => {
          console.log(`hello-nodejs listening on ${port}`);
        });
      })
      .catch((err) => {
        console.error(err);
        process.exit(1);
      });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-nodejs
  namespace: otel-demo
  labels:
    app: hello-nodejs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-nodejs
  template:
    metadata:
      labels:
        app: hello-nodejs
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "monitoring/demo"
    spec:
      containers:
        - name: app
          image: node:20-alpine
          workingDir: /app
          command:
            - sh
            - -c
            - |
              cp /config/package.json /config/server.js /app/
              npm install --omit=dev >/tmp/npm.log 2>&1
              exec node server.js
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: hello-nodejs
            - name: PYTHON_HOST
              value: hello-python.otel-demo.svc
            - name: PYTHON_PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://redis.otel-demo.svc:6379/0
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 40
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: work
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: config
          configMap:
            name: hello-nodejs
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-nodejs
  namespace: otel-demo
  labels:
    app: hello-nodejs
spec:
  selector:
    app: hello-nodejs
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# -----------------------------------------------------------------------------
# Ingress — hit apps via *.test.local
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-demo
  namespace: otel-demo
spec:
  ingressClassName: nginx
  rules:
    - host: otel-node.test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-nodejs
                port:
                  number: 8080
    - host: otel-python.test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-python
                port:
                  number: 8080
