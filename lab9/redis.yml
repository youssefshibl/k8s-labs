# =============================================================================
# Lab 9 — Redis + redis_exporter + Redis Insight
# =============================================================================
# Self-contained Redis for streams (no lab5 dependency).
# Stream key scraped: jobs (REDIS_EXPORTER_CHECK_SINGLE_STREAMS)
#
# Apply (from repo root):
#   kubectl apply -f lab9/redis.yml
#   kubectl wait --for=condition=Available \
#     deploy/stream-redis deploy/stream-redis-exporter deploy/redis-insight --timeout=180s
#
# Redis Insight UI: http://redis-insight.test.local
#   → add DB host stream-redis.default.svc:6379 (no password)
# =============================================================================

# -----------------------------------------------------------------------------
# Redis
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-redis
  labels:
    app: stream-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-redis
  template:
    metadata:
      labels:
        app: stream-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stream-redis
  labels:
    app: stream-redis
spec:
  type: ClusterIP
  selector:
    app: stream-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# -----------------------------------------------------------------------------
# redis_exporter (stream metrics for Grafana)
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-redis-exporter
  labels:
    app: stream-redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-redis-exporter
  template:
    metadata:
      labels:
        app: stream-redis-exporter
      # ServiceMonitor only — no prometheus.io/scrape (avoids duplicate series)
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.94.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_ADDR
              value: redis://stream-redis.default.svc:6379
            - name: REDIS_EXPORTER_CHECK_SINGLE_STREAMS
              value: jobs
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: stream-redis-exporter
  labels:
    app: stream-redis-exporter
spec:
  type: ClusterIP
  selector:
    app: stream-redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: stream-redis-exporter
  labels:
    app: stream-redis-exporter
spec:
  selector:
    matchLabels:
      app: stream-redis-exporter
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
      scrapeTimeout: 10s
---
# -----------------------------------------------------------------------------
# Redis Insight (GUI)
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-insight
  labels:
    app: redis-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-insight
  template:
    metadata:
      labels:
        app: redis-insight
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: redis-insight
          image: redis/redisinsight:2.70
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5540
          env:
            - name: RI_APP_HOST
              value: "0.0.0.0"
            - name: RI_APP_PORT
              value: "5540"
            # Lab only — accept EULA so the UI is usable immediately
            - name: ACCEPT_EULA
              value: "true"
            - name: RI_ACCEPT_TERMS_AND_CONDITIONS
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-insight
  labels:
    app: redis-insight
spec:
  type: ClusterIP
  selector:
    app: redis-insight
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redis-insight
  labels:
    app: redis-insight
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Redis Insight uses websockets / large payloads for workbench
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: redis-insight.test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redis-insight
                port:
                  number: 80
